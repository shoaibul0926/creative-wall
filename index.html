<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wall</title>
<style>
  :root { --bg:#0b0f1a; --ink:#e8ecf6; --line:#26304d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  .wall { display:flex; width:100vw; height:100vh; }
  .slot { position:relative; flex:1 1 50%; height:100%; border:2px solid var(--line); }
  .slot iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .name { position:absolute; top:16px; left:20px; padding:6px 14px;
          font-weight:600; font-size:16px; background:rgba(11,15,26,0.55);
          border-radius:999px; backdrop-filter:blur(4px); pointer-events:none; z-index:1; }

  @media (max-width: 800px) {
    .wall { flex-direction:column; }
    .slot { flex:1 1 50%; width:100%; }
  }
</style>
</head>
<body>
  <main class="wall">
    <div class="slot">
      <div class="name">Shoaibul</div>
      <iframe src="pieces/shoaibul/art.html" loading="lazy" title="Shoaibul"></iframe>
    </div>
    <div class="slot">
      <div class="name">Sahil</div>
      <iframe src="pieces/sahil/art.html" loading="lazy" title="Sahil"></iframe>
    </div>
  </main>
</body>
</html>
