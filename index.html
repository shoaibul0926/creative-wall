<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wall</title>
<style>
  :root { --bg:#0b0f1a; --card:#121829; --ink:#e8ecf6; --line:#26304d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  .wall { display:flex; width:100vw; height:100vh; }
  .slot { display:flex; flex-direction:column; flex:1 1 50%; height:100%; padding:16px; }
  .card { display:flex; flex-direction:column; flex:1 1 auto; border:2px solid var(--line);
          border-radius:8px; overflow:hidden; }
  .name { flex:0 0 auto; padding:10px 0; font-weight:600; font-size:16px; text-align:center;
          background:var(--card); border-bottom:2px solid var(--line); }
  .frame { position:relative; flex:1 1 auto; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

  @media (max-width: 800px) {
    .wall { flex-direction:column; }
    .slot { flex:1 1 50%; width:100%; }
  }
</style>
</head>
<body>
  <main class="wall">
    <div class="slot">
      <div class="card">
        <div class="name">Shoaibul</div>
        <div class="frame"><iframe src="pieces/shoaibul/art.html" loading="lazy" title="Shoaibul"></iframe></div>
      </div>
    </div>
    <div class="slot">
      <div class="card">
        <div class="name">Sahil</div>
        <div class="frame"><iframe src="pieces/sahil/art.html" loading="lazy" title="Sahil"></iframe></div>
      </div>
    </div>
  </main>
  <script>
    // Soft entry chime, synthesized (no audio file needed).
    // Browsers block autoplaying sound until the visitor interacts, so we
    // play it on their very first click/tap/key press on the page.
    function playEntryChime() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.09;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.15, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.9);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.9);
      });
    }
    let played = false;
    function onFirstEntry() {
      if (played) return;
      played = true;
      playEntryChime();
      window.removeEventListener('pointerdown', onFirstEntry);
      window.removeEventListener('keydown', onFirstEntry);
    }
    window.addEventListener('pointerdown', onFirstEntry);
    window.addEventListener('keydown', onFirstEntry);
  </script>
</body>
</html>
