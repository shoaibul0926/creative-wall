<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wall</title>
<style>
  :root { --bg:#0b0f1a; --card:#121829; --ink:#e8ecf6; --line:#26304d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wall { display:grid; gap:20px; padding:40px clamp(16px,4vw,48px);
          grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
          max-width:1300px; margin:0 auto; }
  .slot { background:var(--card); border:1px solid var(--line);
          border-radius:16px; overflow:hidden; }
  .frame { position:relative; aspect-ratio:4/3; background:#0b0f1a; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0;
                  pointer-events:none; }
  .name { padding:12px 15px; font-weight:600; font-size:16px; }
</style>
</head>
<body>
  <main class="wall">
    <div class="slot">
      <div class="frame"><iframe src="pieces/shoaibul/art.html" loading="lazy" title="Shoaibul"></iframe></div>
      <div class="name">Shoaibul</div>
    </div>
    <div class="slot">
      <div class="frame"><iframe src="pieces/sahil/art.html" loading="lazy" title="Sahil"></iframe></div>
      <div class="name">Sahil</div>
    </div>
  </main>
</body>
</html>
