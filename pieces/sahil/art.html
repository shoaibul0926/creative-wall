<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My art</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Faint background stars
const stars = Array.from({ length: 90 }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 1.2 + 0.2,
  phase: Math.random() * Math.PI * 2,
  speed: Math.random() * 1.2 + 0.4
}));

const COLORS = [
  '#ff5e5e', '#ffb45e', '#ffe45e', '#8bff5e',
  '#5ef0ff', '#5e8bff', '#c45eff', '#ff5ec4'
];

let rockets = [];
let particles = [];

function spawnRocket() {
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  rockets.push({
    x: W * (0.15 + Math.random() * 0.7),
    y: H,
    targetY: H * (0.15 + Math.random() * 0.35),
    vy: -(6.5 + Math.random() * 2.5),
    color,
    trail: []
  });
}

function explode(x, y, color) {
  const n = 46 + Math.floor(Math.random() * 24);
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i) / n + Math.random() * 0.2;
    const speed = 1.5 + Math.random() * 3.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: 50 + Math.random() * 30,
      color,
      r: 1.5 + Math.random() * 1.5
    });
  }
}

function updateRockets() {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.trail.push({ x: r.x, y: r.y });
    if (r.trail.length > 8) r.trail.shift();
    r.y += r.vy;
    r.vy += 0.02;
    if (r.y <= r.targetY || r.vy >= 0) {
      explode(r.x, r.y, r.color);
      rockets.splice(i, 1);
    }
  }
}

function drawRockets() {
  rockets.forEach(r => {
    ctx.save();
    r.trail.forEach((p, idx) => {
      ctx.globalAlpha = idx / r.trail.length;
      ctx.fillStyle = r.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.vx *= 0.99;
    p.life++;
    if (p.life > p.maxLife) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = Math.max(0, 1 - p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#04060f');
  grad.addColorStop(1, '#0d1330');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(t) {
  stars.forEach(s => {
    const twinkle = 0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase);
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${0.2 + twinkle * 0.5})`;
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

let spawnTimer = 0;
function frame(t) {
  drawSky();
  drawStars(t);

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnRocket();
    spawnTimer = 45 + Math.random() * 45;
  }

  updateRockets();
  drawRockets();
  updateParticles();
  drawParticles();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
